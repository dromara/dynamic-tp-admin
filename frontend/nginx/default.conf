server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # 避免访问出现 404 错误
    location / {
      try_files $uri $uri/ /index.html;
    }

    # 后端地址，使用 Docker 服务名
    location /api/ {
      proxy_pass http://admin:9999/;
      client_max_body_size 1024m;
      client_body_buffer_size 128k;
      client_body_timeout 900s;
      proxy_connect_timeout 120s;
      proxy_read_timeout  900s;
      proxy_send_timeout 900s;
      proxy_pass_header Authorization;
      proxy_set_header  Host $host;
      proxy_set_header  Upgrade $http_upgrade;
      proxy_set_header  Connection $connection_upgrade;
      proxy_set_header  X-NginX-Proxy true;
      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Proto $scheme;
      proxy_set_header  X-Forwarded-For $remote_addr;
      proxy_hide_header X-Powered-By;
      proxy_redirect off;
      proxy_buffers 32 32k;
    }

    # 禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md) {
      return 404;
    }

    gzip  on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 4;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript image/jpeg image/gif image/png image/x-icon font/ttf font/opentype font/x-woff image/svg+xml;
    gzip_vary on;
}

map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}
